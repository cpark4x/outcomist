[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "outcomist-core"
version = "2.0.0"
description = "Modular decision exploration library with pattern recognition and adaptive questioning"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Chris Park", email = "cpark4x@users.noreply.github.com"}
]
keywords = ["decision-making", "ai", "patterns", "discovery", "exploration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = []

[project.optional-dependencies]
anthropic = ["anthropic>=0.70.0"]
openai = ["openai>=1.0.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0",
    "mypy>=1.0",
]
all = ["anthropic>=0.70.0", "openai>=1.0.0"]

[project.urls]
Homepage = "https://github.com/cpark4x/outcomist"
Repository = "https://github.com/cpark4x/outcomist"
Documentation = "https://github.com/cpark4x/outcomist/blob/main/README.md"
Issues = "https://github.com/cpark4x/outcomist/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["outcomist_core*"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312']

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
